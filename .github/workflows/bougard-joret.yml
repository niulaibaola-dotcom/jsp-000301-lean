name: Bougard-Joret Lean Verify

on:
  push:
    branches:
      - bougard-joret-counterexample
    paths:
      - "jsp-lean/BougardJoret.lean"
      - "BOUGARD_JORET_COUNTEREXAMPLE.md"
      - ".github/workflows/bougard-joret.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jsp-lean
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies
        run: lake update

      - name: Restore mathlib build cache
        run: lake exe cache get

      - name: Compile Bougard-Joret proof
        run: lake env lean BougardJoret.lean

      - name: Reject placeholders and unsafe proof shortcuts
        run: |
          if grep -nE '\b(sorry|admit|native_decide)\b' BougardJoret.lean; then
            echo "Forbidden proof shortcut found"
            exit 1
          fi
          if grep -nE '^[[:space:]]*(axiom|constant)[[:space:]]' BougardJoret.lean; then
            echo "Forbidden local axiom/constant declaration found"
            exit 1
          fi
