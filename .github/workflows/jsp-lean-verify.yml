name: JSP Lean Verify

on:
  push:
    branches:
      - main
    paths:
      - "jsp-lean/**"
      - ".github/workflows/jsp-lean-verify.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jsp-lean
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Fetch dependencies
        run: lake update

      - name: Restore mathlib build cache
        run: lake exe cache get

      - name: Build project
        run: lake build

      - name: Audit main theorem axioms
        run: lake env lean Audit.lean

      - name: Reject proof placeholders and local assumptions
        run: |
          if grep -R -nE '\b(sorry|admit)\b' JSP000301.lean Audit.lean; then
            echo "Forbidden proof placeholder found"
            exit 1
          fi
          if grep -R -nE '^[[:space:]]*(axiom|constant)[[:space:]]' JSP000301.lean Audit.lean; then
            echo "Forbidden local axiom/constant declaration found"
            exit 1
          fi
